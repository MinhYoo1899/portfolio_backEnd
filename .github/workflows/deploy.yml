name: Deploy

# develop 브랜치 push 시 개발서버(self-hosted runner)로 자동 배포한다.
# 러너에서 빌드+검증을 통과해야만 deploy.sh 가 실행된다(실패 시 기존 버전 유지).
# (운영 서버가 생기면 testBoot 방식의 v* 태그 배포 워크플로를 별도로 추가한다)
on:
  push:
    branches: ["develop"]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

# GITHUB_TOKEN 최소권한 — 배포는 코드 읽기(checkout)만 필요 (서드파티 액션 오염 시 피해 차단, codex 교차검토 필수수정)
permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted]
    steps:
      # 서드파티 액션은 40자 커밋 SHA 로 고정(공급망 보안 — 태그 바꿔치기 차단). 버전 업데이트는 Dependabot 이 PR 로 제안.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"
          # cache 미사용(C3, 2026-06-29): self-hosted 영구 ~/.m2 캐시가 손상 artifact 재오염원이 될 수 있어 제거. 빌드는 아래 run-local temp repo 사용.

      - name: Build & Verify (검증 실패 시 배포 중단)
        run: |
          chmod +x mvnw
          # self-hosted 영구 ~/.m2 오염이 deploy build에 영향 주지 않게 run-local temp repo 격리 + strict checksum 으로 손상 다운로드 초기 차단(C3). 첫 배포는 재다운로드로 느릴 수 있음(허용).
          ./mvnw -B -Dmaven.repo.local="$RUNNER_TEMP/m2" -C clean verify

      - name: Deploy to dev server (교체 + 헬스체크 + 실패 시 롤백)
        run: |
          chmod +x deploy/deploy.sh
          deploy/deploy.sh
