name: CI

# 모든 push / PR 에서 "빌드 가능한 정상 버전"인지 검증한다(배포는 하지 않음).
# 검증 클래스(*Verification — ArchUnit/상태코드/명명규칙)가 함께 실행된다.
on:
  push:
    branches: ["**"]
  pull_request:

# GITHUB_TOKEN 최소권한 — 빌드 검증은 코드 읽기만 필요 (서드파티 액션 오염 시 피해 차단, codex 교차검토 반영)
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 서드파티 액션은 40자 커밋 SHA 로 고정(공급망 보안 — 태그 바꿔치기 차단). 버전 업데이트는 Dependabot 이 PR 로 제안.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build & Verify (정상 버전 게이트)
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify
