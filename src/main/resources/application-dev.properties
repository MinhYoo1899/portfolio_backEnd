#==============================================================================
# dev 프로파일 전용 설정 — 운영(prod)에는 이 파일이 적용되지 않는다.
#==============================================================================

# 개발 전용 Flyway 시드(R__dev_master_account.sql 등) — dev 에서만 적용
spring.flyway.locations=classpath:db/migration,classpath:db/migration-dev

# 개발 운영자 계정(BCrypt 해시) — 기본값은 개발 공용(EeumMaster1!), 필요 시 환경변수로 교체
spring.flyway.placeholders.devMasterEnpswd=${DEV_MASTER_ENPSWD:$2a$10$VKUYGuLMJeIoayyuM6ClQuNmxcWxcFlJGNN38t09HARHVMDG9SAey}

# Swagger/OpenAPI — 개발 단계에선 사용. 이 한 줄로 springdoc(명세·UI) 2개 + SecurityConfig 화이트리스트가 모두 켜짐.
eeum.swagger.enabled=true

# JWT — dev 공개 테스트 키(비밀 아님. 운영/개발서버 실제 키와 절대 공유 금지). 32바이트+ (보안 자가점검+codex).
#   개발서버는 EGOV_JWT_SECRET(무작위)를 env 로 주입하므로 이 기본값을 덮어쓴다. 로컬 실행 편의용 fallback.
Globals.jwt.secret=${EGOV_JWT_SECRET:eeum-dev-only-public-jwt-key-not-a-secret-change-in-prod-0123456789}
# dev 는 HTTP 라 refresh 쿠키 Secure 불가
Globals.jwt.cookieSecure=${JWT_COOKIE_SECURE:false}
