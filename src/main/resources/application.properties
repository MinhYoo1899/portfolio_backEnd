#==============================================================================
# 이음 고택숙박 예약 백엔드 — 공통 설정
# 민감값(DB/JWT/Redis 비밀번호 등)은 환경변수로 주입한다. (.env / IntelliJ Run Config / OS 환경변수)
#==============================================================================
# 기본 프로파일 없음(안전 기본값 — dev 시드 유입 차단, codex 재검토 반영). 개발은 SPRING_PROFILE=dev 명시(.env.develop 참고)
spring.profiles.active=${SPRING_PROFILE:}
spring.config.use-legacy-processing=true
spring.application.name=eeum-backend

#------------------------------------------------------------------------------
# DB (원격 개발서버 MySQL) — eGov Globals.DbType 으로 벤더 선택
#------------------------------------------------------------------------------
Globals.DbType=mysql
Globals.mysql.DriverClassName=com.mysql.cj.jdbc.Driver
# serverTimezone=UTC — 타임존 표준(docs/timezone-standard.md): 발생 순간은 UTC instant 저장. 숙박 날짜는 DATE/LocalDate(KST).
Globals.mysql.Url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:eeum}?serverTimezone=UTC&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
Globals.mysql.UserName=${DB_USERNAME}
Globals.mysql.Password=${DB_PASSWORD}

#------------------------------------------------------------------------------
# Flyway (DB 마이그레이션) — eGov dataSource 빈 사용
# ⚠ 부팅 시 "검사(validate)만" — 적용(migrate)은 수동 명령 전용 (FlywayValidateOnlyConfig, 팀 룰 2026-06-12:
#   앱 구동과 DB 변경 분리). 미적용분이 있으면 기동 거부됨 → scripts/db-migrate-dev.ps1 -Apply 로 먼저 적용
#------------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# 공통 마이그레이션만 — 개발 전용 시드 location 은 application-dev.properties 에서만 추가(운영 유입 차단, codex 권고)
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

#------------------------------------------------------------------------------
# Redis (refresh 토큰 / 예약 hold / 캐시) — Lettuce 는 최초 사용 시 연결(부팅 미차단)
#------------------------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
# 장애 시 무한대기 방지 (codex 권고: fail-fast — 세션/hold 용도)
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=2s

#------------------------------------------------------------------------------
# eGov 공통 설정 (EgovConfigAppProperties/Common 이 바인딩 — 누락 시 부팅 실패)
#------------------------------------------------------------------------------
Globals.LocalIp=127.0.0.1
Globals.addedOptions=false
Globals.MainPage=/

#------------------------------------------------------------------------------
# 페이지네이션 기본값
#------------------------------------------------------------------------------
Globals.pageUnit=10
Globals.pageSize=10

#------------------------------------------------------------------------------
# 파일(임시 — 추후 object storage 로 대체)
#------------------------------------------------------------------------------
Globals.fileStorePath=./files
Globals.posblAtchFileSize=5242880
Globals.fileUpload.Extensions.Images=.gif.jpg.jpeg.png
Globals.fileUpload.Extensions=.gif.jpg.jpeg.png.webp.xls.xlsx

#------------------------------------------------------------------------------
# CORS (멀티 SPA origin — 콤마로 복수 지정)
#------------------------------------------------------------------------------
Globals.Allow.Origin=${CORS_ALLOW_ORIGIN:http://localhost:3000}

#------------------------------------------------------------------------------
# 암호화 / JWT (운영은 환경변수로 반드시 교체)
#------------------------------------------------------------------------------
Globals.crypto.algoritm=${EGOV_CRYPTO_KEY:eeum-local-crypto-key}
# JWT 서명키 — 기본값 없음(fail-fast): 미주입 시 기동 거부(약한 공개 기본값으로 토큰 위조되는 사고 차단, 보안 자가점검+codex).
#   dev 는 application-dev.properties 에 dev 공개 테스트 키. 운영은 EGOV_JWT_SECRET 환경변수로 32바이트+ 무작위 주입 필수.
Globals.jwt.secret=${EGOV_JWT_SECRET}
# refresh 쿠키 Secure 기본 true(운영=HTTPS) — dev(HTTP)만 application-dev.properties 에서 false 로 내린다.
Globals.jwt.cookieSecure=${JWT_COOKIE_SECURE:true}
# 토큰 만료(확정): access 30분 / refresh 14일 — refresh 는 Redis 세션(회전) 병행
Globals.jwt.accessValiditySeconds=${JWT_ACCESS_VALIDITY_SECONDS:1800}
Globals.jwt.refreshValiditySeconds=${JWT_REFRESH_VALIDITY_SECONDS:1209600}

#------------------------------------------------------------------------------
# 소셜 로그인 — 구글 OIDC (id_token 검증). 비밀값은 env 주입(.env.develop 로컬 / 서버는 /etc/eeum/eeum.env).
# 기본값 빈값 = 미설정이어도 앱은 정상 기동, 소셜 로그인만 비활성(fail-safe). client-id 는 id_token aud 검증에도 사용.
#------------------------------------------------------------------------------
eeum.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
eeum.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
eeum.oauth.google.issuer=https://accounts.google.com
eeum.oauth.google.jwks-uri=https://www.googleapis.com/oauth2/v3/certs
# 카카오 OIDC — client-id = REST API 키(=aud). client-secret 은 웹 Auth Code 교환용.
eeum.oauth.kakao.client-id=${KAKAO_CLIENT_ID:}
eeum.oauth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
eeum.oauth.kakao.issuer=https://kauth.kakao.com
eeum.oauth.kakao.jwks-uri=https://kauth.kakao.com/.well-known/jwks.json

#------------------------------------------------------------------------------
# 웹 Authorization Code + PKCE 흐름 (Phase 2 — 구글·카카오). 콜백 redirect_uri 는 callback-base-url 로 고정(Host 동적생성 금지).
# 프론트 redirect 는 web.redirects allowlist 에 있는 키만 허용(오픈리다이렉트 차단). 추후 실제 프론트 도메인으로 교체.
#------------------------------------------------------------------------------
eeum.oauth.callback-base-url=${OAUTH_CALLBACK_BASE_URL:http://minoservers.iptime.org:8082}
eeum.oauth.google.authorize-uri=https://accounts.google.com/o/oauth2/v2/auth
eeum.oauth.google.token-uri=https://oauth2.googleapis.com/token
eeum.oauth.google.scope=openid email profile
eeum.oauth.kakao.authorize-uri=https://kauth.kakao.com/oauth/authorize
eeum.oauth.kakao.token-uri=https://kauth.kakao.com/oauth/token
eeum.oauth.kakao.scope=openid
# 네이버 — 레거시 OAuth2.0(access_token → /v1/nid/me). id_token/JWKS/PKCE 없음(웹 Auth Code 전용).
eeum.oauth.naver.client-id=${NAVER_CLIENT_ID:}
eeum.oauth.naver.client-secret=${NAVER_CLIENT_SECRET:}
eeum.oauth.naver.authorize-uri=https://nid.naver.com/oauth2.0/authorize
eeum.oauth.naver.token-uri=https://nid.naver.com/oauth2.0/token
eeum.oauth.naver.userinfo-uri=https://openapi.naver.com/v1/nid/me
# 프론트 redirect allowlist (redirectKey=URL). 기본 키 default 만 — 알려진 키 없으면 거부.
eeum.oauth.web.redirects.default=${OAUTH_REDIRECT_DEFAULT:http://localhost:5173/oauth/callback}
# 흐름 바인딩 쿠키(로그인 CSRF 차단) — dev=Lax/비보안(HTTP), 운영=None+Secure(HTTPS, cross-site 프론트). path=/auth/oauth.
eeum.oauth.cookie.secure=${OAUTH_COOKIE_SECURE:false}
eeum.oauth.cookie.same-site=${OAUTH_COOKIE_SAMESITE:Lax}

#------------------------------------------------------------------------------
# 파일 첨부 (Phase 1 — PUBLIC_IMAGE / SFTP 저장). 비밀값은 env 주입(.env.develop / 서버 env).
# host 빈값이면 파일 기능 비활성(fail-safe — 부팅은 정상). 실제 저장은 호출 시 지연 연결.
#------------------------------------------------------------------------------
# 공개 이미지 업로드 상한 — 서비스 레벨 검증(멀티파트 전역 55MB와 별개, 초과 시 413)
eeum.file.public-image.max-size=50MB
eeum.file.public-image.allowed-extensions=gif,jpg,jpeg,png
# 이미지 해상도 상한(픽셀폭탄/디코딩 자원고갈 방어) — width×height
eeum.file.public-image.max-pixels=50000000
# 업로더 1인당 최근 24시간 쿼터(저장소 고갈 방어) — 건수 / 누적용량
eeum.file.public-image.daily-max-count=50
eeum.file.public-image.daily-max-size=500MB
# SFTP 저장소 (운영=별도 파일서버 / dev=배포서버). 포트는 SSH(기본 22).
eeum.file.sftp.host=${FILE_SFTP_HOST:}
eeum.file.sftp.port=${FILE_SFTP_PORT:22}
eeum.file.sftp.username=${FILE_SFTP_USERNAME:}
eeum.file.sftp.password=${FILE_SFTP_PASSWORD:}
# 저장 베이스 경로(chroot 계정이면 chroot 내부 경로). 실제 저장 = base + /public/yyyyMM/uuid.ext
eeum.file.sftp.base-path=${FILE_SFTP_BASE_PATH:/storage/eeum}
# 호스트키 검증(필수, MITM 방지) — known_hosts 파일 경로. 비어 있고 host 가 설정되면 파일기능 비활성(StrictHostKeyChecking=no 금지)
eeum.file.sftp.known-hosts-path=${FILE_SFTP_KNOWN_HOSTS:}
eeum.file.sftp.connect-timeout-ms=${FILE_SFTP_CONNECT_TIMEOUT_MS:5000}
# 세션 풀 — 동시 borrow 상한, 고갈 시 503
eeum.file.sftp.pool-max=${FILE_SFTP_POOL_MAX:4}
eeum.file.sftp.pool-borrow-timeout-ms=${FILE_SFTP_POOL_BORROW_TIMEOUT_MS:5000}

#------------------------------------------------------------------------------
# 가입 유형별 기본 역할 매핑 (데이터 주도 RBAC — 값은 ROLE.ROLE_CD 데이터. 코드에 역할명 하드코딩 금지)
#------------------------------------------------------------------------------
eeum.account.default-role.member=MEMBER

#------------------------------------------------------------------------------
# 프로필 이미지 (PROFILE_IMAGE — 본인 인증만, EXIF/GPS 제거 재인코딩 후 SFTP 저장)
#------------------------------------------------------------------------------
# 프로필 이미지 1건 상한(초과 시 413). 공개 이미지(50MB)보다 엄격.
eeum.account.profile-image.max-size=5MB
eeum.account.profile-image.allowed-extensions=jpg,jpeg,png
# 재인코딩(디코딩) 전 해상도 상한 — 픽셀폭탄/OOM 방어. 프로필은 16MP면 충분(codex 교차검토 Medium 6)
eeum.account.profile-image.max-pixels=16000000
# 업로더 1인당 최근 24시간 쿼터(건수/누적용량)
eeum.account.profile-image.daily-max-count=50
eeum.account.profile-image.daily-max-size=200MB
eeum.account.default-role.partner=PARTNER

#------------------------------------------------------------------------------
# 이메일 소유확인(가입 이메일 인증) — 6자리 코드. 챌린지는 Redis(HMAC 저장·TTL·1회성).
# 완화형: 가입 즉시 ACTIVE + EML_VRFD_YN='N'. 검증 성공 시 Y(세대 무효화 안 함 — 이메일 검증은 보안 강화).
#------------------------------------------------------------------------------
# 인증코드 유효시간(초)
eeum.email.verification.ttl-seconds=300
# 코드 검증 시도 제한(초과 시 챌린지 폐기)
eeum.email.verification.max-attempts=5
# 재발송 쿨다운(초)
eeum.email.verification.resend-cooldown-seconds=60
# 일일 발송 한도(userSn 기준)
eeum.email.verification.daily-limit=5
# HMAC 서명키 — 미지정 시 JWT secret fallback(이미 32바이트+ 강제). purpose 도메인 분리로 키 재사용 위험 완화.
eeum.email.verification.hmac-secret=${EEUM_EMAIL_HMAC_SECRET:${Globals.jwt.secret}}

#------------------------------------------------------------------------------
# 운영자 계정관리 — 비밀번호 설정/초기화 토큰. 챌린지는 Redis(HMAC 저장·TTL·1회성, operator:setup:{userSn}).
# 운영자 생성/비번초기화 시 1회성 토큰 발급 → 대상 본인이 setup-password 로 비밀번호 설정(PENDING→ACTIVE).
#------------------------------------------------------------------------------
# 설정토큰 유효시간(초) — 기본 48시간
eeum.operator.setup.ttl-seconds=172800
# 설정 화면 URL 베이스(발급 토큰을 token 쿼리로 부착). 추후 실제 운영자 SPA 도메인으로 교체.
eeum.operator.setup.url-base=${OPERATOR_SETUP_URL_BASE:http://localhost:5173/operator/setup-password}
# HMAC 서명키 — 미지정 시 JWT secret fallback(이미 32바이트+ 강제).
eeum.operator.setup.hmac-secret=${EEUM_OPERATOR_HMAC_SECRET:${Globals.jwt.secret}}

#------------------------------------------------------------------------------
# 멱등키(Idempotency-Key) — 생성(insert) API 의 중복 제출/재시도 방어(opt-in). 헤더가 있을 때만 동작(없으면 무변경).
# 키: idem:v1:{userSn}:{channel}:{method}:{routePath}:{idempotencyKey}, 값=레코드 JSON(Redis). 본문해시는 값에 저장·히트 시 비교.
#------------------------------------------------------------------------------
# 선점(PENDING) TTL(초) — 게이트웨이/서버 요청 타임아웃 이상이어야 함(nginx 기본 proxy_read_timeout 60s 커버)
eeum.idempotency.pending-ttl-seconds=60
# 완료(DONE) TTL(초) — 응답 재생 보관기간(24h)
eeum.idempotency.done-ttl-seconds=86400
# 보호 대상 경로(정확 일치, 콤마 구분) — POST + 헤더 + 인증 principal 이 모두 성립할 때만 동작.
# ⚠ IdempotencyProperties.REQUIRED_GUARDED_PATHS(하드코딩 5종)를 전부 포함해야 기동(subset 미충족 시 IllegalStateException).
eeum.idempotency.guarded-paths=/houses/insert,/operator/houses/insert,/rooms/insert,/operator/rooms/insert,/reservations
# 재생 대상 응답 헤더 allowlist — Content-Type 은 별도 처리. Set-Cookie/Authorization/보안헤더는 절대 재생 금지.
eeum.idempotency.replay-headers=Location

#------------------------------------------------------------------------------
# 문의 첨부 (INQR_ATTACH — 선업로드-후연결, EXIF/GPS 제거 재인코딩, 하이브리드 공개성 PUBLIC/PRIVATE)
#------------------------------------------------------------------------------
# 첨부 1건 상한(초과 시 413). 문의 첨부는 이미지(jpg/jpeg/png)만.
eeum.inquiry.attachment.max-size=10MB
eeum.inquiry.attachment.allowed-extensions=jpg,jpeg,png
# 재인코딩(디코딩) 전 해상도 상한 — 픽셀폭탄/OOM 방어
eeum.inquiry.attachment.max-pixels=16000000
# 업로더 1인당 최근 24시간 쿼터(스코프 INQR_ATTACH 기준 — 건수/누적용량)
eeum.inquiry.attachment.daily-max-count=50
eeum.inquiry.attachment.daily-max-size=200MB
# 문의 1건당 첨부 개수/총 용량 상한(연결 시 검증)
eeum.inquiry.attachment.max-per-inquiry=5
eeum.inquiry.attachment.max-total-size-per-inquiry=30MB
# 미연결 임시(TEMP) 업로드 정리 TTL(시간) — 정리잡 1시간 주기
eeum.inquiry.attachment.temp-ttl-hours=24

#------------------------------------------------------------------------------
# 서버
#------------------------------------------------------------------------------
# 직렬화 — 발생 순간(Instant)을 ISO-8601 문자열(...Z)로 출력. true(기본 숫자 타임스탬프) 방지 (타임존 표준 docs/timezone-standard.md §2)
spring.jackson.serialization.write-dates-as-timestamps=false

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/
server.servlet.session.timeout=3600
spring.mvc.pathmatch.matching-strategy=ant-path-matcher
# graceful shutdown — 진행 중 요청을 완료한 뒤 종료(배포 중 끊김 방지). 최대 대기 20s.
# ⚠ systemd 의 TimeoutStopSec >= 20s 여야 유효(이 값보다 작으면 강제 SIGKILL) — 서버 작업, 별도.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
# 에러 응답 내부정보 노출 차단(명시) — 표준 /error 본문에 메시지/스택/바인딩에러/예외클래스 비노출.
#   ※ 이음 API 오류는 ApiResponse 표준 포맷 별도 제공 — 아래는 Spring 기본 /error 경로의 누출 방지(codex 교차검토).
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
# HTTP TRACE 메서드 차단(XST 등 방지).
server.tomcat.allow-trace=false
# 멀티파트 한도는 SecurityConfig.multipartConfigElement() 빈이 결정(파일 55MB / 요청 60MB).
# ※ MultipartConfigElement 빈이 존재하면 spring.servlet.multipart.* 프로퍼티는 무시되므로 여기서 설정하지 않는다(단일 진실원, codex 교차검토).

#------------------------------------------------------------------------------
# 로깅
# ⚠ 로깅 구성 권위 = src/main/resources/log4j2-spring.xml (PII 마스킹 %mask + 롤링/압축/삭제 정책).
#   아래 logging.* 값들은 log4j2-spring.xml 존재 시 비활성(무시)이지만, 혼동 방지·이력 보존 위해 제거하지 않고 둔다.
#------------------------------------------------------------------------------
logging.level.root=INFO
# 상관관계 ID(corrId)를 모든 로그 라인에 표기 — 감사로그·응답헤더(X-Correlation-Id)와 연결
# ⚠ 로깅 백엔드 = Log4j2 — Logback 식 기본값 문법(%X{key:-})은 미동작, %X{key}만 사용 (codex 교차검토 반영)
# [비활성] log4j2-spring.xml 의 패턴이 권위 — corrId 표기는 거기서 [cid:%X{corrId}] 로 유지.
logging.pattern.level=%5p [cid:%X{corrId}]
# [비활성] 파일 경로는 log4j2-spring.xml 의 RollingFile(${logDir}/backend.log, 기본 ./log) 이 권위. 경로 동일.
logging.file.name=./log/backend.log
# [비활성] 정밀 롤링은 log4j2-spring.xml 이 담당(SizeBased 10MB + daily + gz + 14d/512MB Delete).
logging.file.path=./log
# 정밀 롤링(보존기간·압축·삭제 정책)은 log4j2-spring.xml 로 구현 완료(운영 전 필수 백로그 해소).

#------------------------------------------------------------------------------
# Actuator — 배포 헬스체크 전용 (health 외 전부 비노출. 상세정보는 인증 없이 노출 금지)
# deploy 그룹: 배포 성공 판정 전용(DB·Redis·디스크). deploy.sh 가 /actuator/health/deploy 를 본다.
#   - SFTP(파일첨부=보조기능) 제외: 파일서버 장애를 배포 실패로 보지 않음(장애 범위 과대 방지).
#   - liveness/readiness probes 는 미사용: 단일서버/systemd 라 소비자(자동 재시작·트래픽 게이팅)가 없음
#     → 실제 소비자(watchdog/프록시/모니터링/k8s) 생길 때 추가(codex 교차검토 2R 결론).
#   - cache 2s: 집계 /health read 부하 완화용(그룹 하위경로엔 적용 불확실 — codex). 외부 남용 본격 방어는
#     reverse proxy/IP 제한/rate-limit 이 정확(백로그). 상세·컴포넌트는 비노출(상태만, 정보누출 최소).
#------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.cache.time-to-live=2s
management.endpoint.health.group.deploy.include=db,redis,diskSpace
management.endpoint.health.group.deploy.show-details=never
management.endpoint.health.group.deploy.show-components=never

#------------------------------------------------------------------------------
# Swagger / OpenAPI
#------------------------------------------------------------------------------
# 기본은 꺼둠(secure by default) — 프로파일 없는 환경(향후 운영)은 API 명세 비노출. dev 프로파일에서만 켠다(codex 교차검토).
# 단일 토글: eeum.swagger.enabled 하나로 springdoc 2개 + SecurityConfig 화이트리스트가 모두 파생(어긋남 방지 — 단일 진실원).
eeum.swagger.enabled=false
springdoc.api-docs.enabled=${eeum.swagger.enabled}
springdoc.swagger-ui.enabled=${eeum.swagger.enabled}
# 이음 API 만 문서화 — eGov 내장(com) 컨트롤러 노출 방지 (codex 권고)
springdoc.packages-to-scan=egovframework.eeum
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.api-docs.path=/v3/api-docs
